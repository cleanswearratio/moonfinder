name: Fetch city data

# Manual only — click "Run workflow" in the Actions tab. Downloads the GeoNames
# cities15000 dump (CC-BY 4.0), builds public/data/cities.json per
# tools/trim_geonames.py, and commits it straight to the branch you pick.
#
# GeoNames is unreachable from some sandboxed environments, which is why this
# runs on a normal GitHub-hosted runner instead. trim_geonames.py needs only
# the Python standard library, so no dependency install step is required.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download the GeoNames dump
        run: |
          mkdir -p tools/.cache
          cd tools/.cache
          curl -sSLO https://download.geonames.org/export/dump/cities15000.zip
          curl -sSLO https://download.geonames.org/export/dump/admin1CodesASCII.txt
          unzip -o cities15000.zip

      - name: Build the city index
        run: python3 tools/trim_geonames.py

      - name: Commit the result, if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cities.json
          if git diff --cached --quiet; then
            echo "cities.json is unchanged, nothing to commit."
          else
            git commit -m "Update city index from GeoNames"
            git push
          fi
