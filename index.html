<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moon sign finder</title>
    <meta
      name="description"
      content="Find the sign the Moon was in when you were born. Free, instant, and honest about the cases where the birth time decides it."
    />
    <meta name="theme-color" content="#2E3552" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Self-hosted, Latin-subset woff2 (src/styles/fonts.css, imported from
      app.css). No third-party request for fonts — the last one on the page,
      per CLAUDE.md §11, is gone. Preloaded because they gate the display
      headline and mono data lines that render immediately on the reveal.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/public-sans.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/bodoni-moda.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-mono.woff2" crossorigin />

    <!-- The answer is a lookup in these; fetch them alongside the bundle. -->
    <link rel="preload" as="fetch" href="/data/moon-ingress.json" crossorigin />
    <link rel="preload" as="fetch" href="/data/sun-ingress.json" crossorigin />
  </head>
  <body>
    <main id="app" class="page">
      <noscript>
        <section class="form">
          <h1 class="form__title">Moon sign finder</h1>
          <p>
            This page works out your moon sign in the browser, so it needs
            JavaScript switched on. Nothing is sent anywhere until you ask for
            the full profile.
          </p>
        </section>
      </noscript>
    </main>

    <footer class="footer">
      <!-- CC-BY 4.0 requires this attribution. §11 checks for it. -->
      <p>
        City data from
        <a href="https://www.geonames.org/" rel="noopener noreferrer">GeoNames</a>,
        licensed CC-BY 4.0. Positions computed from JPL DE421.
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
